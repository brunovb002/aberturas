[project]
name = "aberturas"
version = "0.1.0"
description = "Aproveitamento das aberturas de xadrez por faixa de rating, com a base aberta do Lichess"
requires-python = ">=3.11"
dependencies = ["zstandard"]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
