name: Atualizar meses

on:
  schedule:
    - cron: "0 12 6 * *"  # dia 6, quando o Lichess já publicou o mês anterior
  workflow_dispatch:
    inputs:
      desde:
        description: "Primeiro mês (AAAA-MM)"
        default: "2013-01"
      max:
        description: "No máximo quantos meses nesta rodada"
        default: "200"

permissions:
  contents: write

# Duas rodadas ao mesmo tempo brigariam pelo push.
concurrency: atualizar-meses

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar
        run: pip install -e ".[dev]"

      - name: Testes
        run: pytest -q

      # Um commit por mês: se a rodada estourar o tempo, o que já foi feito fica salvo
      # e a próxima continua de onde parou.
      - name: Processar os meses que faltam
        env:
          DESDE: ${{ inputs.desde || '2013-01' }}
          MAX: ${{ inputs.max || '200' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in $(seq 1 "$MAX"); do
            python -m aberturas pendentes --desde "$DESDE" --max 1
            git add meses
            if git diff --cached --quiet; then
              echo "Nada novo."
              break
            fi
            mes=$(git diff --cached --name-only --diff-filter=A -- 'meses/????-??.json' | head -1 | xargs -r basename -s .json)
            git commit -q -m "Adiciona ${mes:-meses}"
            git pull -q --rebase
            git push -q
          done

      - name: Atualizar o resumo por ano
        run: |
          python -m aberturas evolucao
          git add evolucao.json
          if ! git diff --cached --quiet; then
            git commit -q -m "Atualiza evolucao.json"
            git pull -q --rebase
            git push -q
          fi
